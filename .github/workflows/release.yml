# Whenever main gets a version (Def.Version in src/presence.cpp) that has no release yet, this builds
# GW2WvWPresence.dll and publishes it as release vX.Y.Z. Nexus then installs it for everyone on
# their next game start. Notes come from release-notes/vX.Y.Z.md if that file exists.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the addon version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=v$(grep -oP 'Def\.Version\.(Major|Minor|Build) = \K[0-9]+' src/presence.cpp | paste -sd.)
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists, nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.ver.outputs.new == 'true'
        run: |
          pip install ziglang==0.17.1
          ./build.sh

      - name: Publish release
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          notes="release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" build/GW2WvWPresence.dll --target "$GITHUB_SHA" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" build/GW2WvWPresence.dll --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
